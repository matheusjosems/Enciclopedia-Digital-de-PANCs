<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso — Enciclopédia de PANCs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <div id="navbar-container"></div>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden">
      
      <!-- Cabeçalho do Card -->
      <div class="bg-gradient-to-r from-emerald-800 to-teal-800 p-6 text-center text-white">
        <span class="text-4xl">🌿</span>
        <h2 class="text-2xl font-extrabold mt-2 tracking-tight">Enciclopédia de PANCs</h2>
        <p class="text-emerald-100 text-xs mt-1">Identificação botânica e diário de descobertas</p>
      </div>

      <!-- Alternador de Abas (Login / Cadastro) -->
      <div class="flex border-b border-slate-200 text-sm font-semibold">
        <button id="tab-login" class="flex-1 py-3 text-center text-emerald-700 border-b-2 border-emerald-600 bg-white transition">
          Entrar (Login)
        </button>
        <button id="tab-cadastro" class="flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent bg-slate-50 hover:text-slate-700 transition">
          Criar Nova Conta
        </button>
      </div>

      <div class="p-6 sm:p-8">
        <!-- Alerta de Notificação -->
        <div id="alerta" class="hidden mb-4 p-3 rounded-xl text-xs sm:text-sm font-medium"></div>

        <!-- Formulário de LOGIN -->
        <form id="form-login" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">E-mail</label>
            <input 
              type="email" 
              id="login-email" 
              required
              placeholder="seu.email@exemplo.com"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
            >
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Senha</label>
            <input 
              type="password" 
              id="login-senha" 
              required
              placeholder="••••••••"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
            >
          </div>

          <button 
            type="submit" 
            id="btn-login-submit"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition duration-200 text-sm"
          >
            Acessar Sistema
          </button>
        </form>

        <!-- Formulário de CADASTRO (RF01) -->
        <form id="form-cadastro" class="hidden space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nome Completo</label>
            <input 
              type="text" 
              id="cad-nome" 
              required
              placeholder="Seu Nome"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
            >
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">E-mail</label>
            <input 
              type="email" 
              id="cad-email" 
              required
              placeholder="seu.email@exemplo.com"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
            >
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Senha (Mínimo 6 caracteres)</label>
            <input 
              type="password" 
              id="cad-senha" 
              required
              minlength="6"
              placeholder="••••••••"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
            >
          </div>

          <button 
            type="submit" 
            id="btn-cad-submit"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition duration-200 text-sm"
          >
            Cadastrar Conta
          </button>
        </form>

      </div>
    </div>
  </main>

  <footer class="bg-slate-900 text-slate-400 py-4 text-center text-xs">
    <p>🌿 Enciclopédia Digital de PANCs — Ciência da Computação (CEUB)</p>
  </footer>

  <script src="/static/app.js"></script>
  <script>
    const tabLogin = document.getElementById("tab-login");
    const tabCadastro = document.getElementById("tab-cadastro");
    const formLogin = document.getElementById("form-login");
    const formCadastro = document.getElementById("form-cadastro");
    const alerta = document.getElementById("alerta");

    function mostrarAlerta(msg, sucesso = false) {
      alerta.classList.remove("hidden", "bg-red-50", "text-red-700", "border-red-200", "bg-emerald-50", "text-emerald-700", "border-emerald-200");
      if (sucesso) {
        alerta.classList.add("bg-emerald-50", "text-emerald-700", "border", "border-emerald-200");
      } else {
        alerta.classList.add("bg-red-50", "text-red-700", "border", "border-red-200");
      }
      alerta.textContent = msg;
    }

    // Alternador de Abas
    tabLogin.addEventListener("click", () => {
      tabLogin.className = "flex-1 py-3 text-center text-emerald-700 border-b-2 border-emerald-600 bg-white transition font-semibold";
      tabCadastro.className = "flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent bg-slate-50 hover:text-slate-700 transition font-semibold";
      formLogin.classList.remove("hidden");
      formCadastro.classList.add("hidden");
      alerta.classList.add("hidden");
    });

    tabCadastro.addEventListener("click", () => {
      tabCadastro.className = "flex-1 py-3 text-center text-emerald-700 border-b-2 border-emerald-600 bg-white transition font-semibold";
      tabLogin.className = "flex-1 py-3 text-center text-slate-400 border-b-2 border-transparent bg-slate-50 hover:text-slate-700 transition font-semibold";
      formCadastro.classList.remove("hidden");
      formLogin.classList.add("hidden");
      alerta.classList.add("hidden");
    });

    // Submissão do LOGIN (RF02)
    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const senha = document.getElementById("login-senha").value;
      const btn = document.getElementById("btn-login-submit");

      try {
        btn.disabled = true;
        btn.textContent = "Autenticando...";
        alerta.classList.add("hidden");

        const res = await apiFetch("/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, senha })
        });

        const dados = await res.json();
        if (!res.ok) {
          throw new Error(dados.detail || "E-mail ou senha incorretos.");
        }

        // Salva token JWT no localStorage
        setToken(dados.access_token);

        // Busca dados do perfil
        const resUser = await apiFetch("/usuarios/me");
        if (resUser.ok) {
          const user = await resUser.json();
          setUsuarioLogado(user);
        }

        mostrarAlerta("Login realizado com sucesso! Redirecionando...", true);
        setTimeout(() => {
          window.location.href = "/";
        }, 1000);

      } catch (err) {
        mostrarAlerta(err.message, false);
      } finally {
        btn.disabled = false;
        btn.textContent = "Acessar Sistema";
      }
    });

    // Submissão do CADASTRO (RF01)
    formCadastro.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nome = document.getElementById("cad-nome").value.trim();
      const email = document.getElementById("cad-email").value.trim();
      const senha = document.getElementById("cad-senha").value;
      const btn = document.getElementById("btn-cad-submit");

      try {
        btn.disabled = true;
        btn.textContent = "Criando conta...";
        alerta.classList.add("hidden");

        const res = await apiFetch("/auth/cadastro", {
          method: "POST",
          body: JSON.stringify({ nome, email, senha })
        });

        const dados = await res.json();
        if (!res.ok) {
          throw new Error(dados.detail || "Erro ao criar conta.");
        }

        mostrarAlerta("Conta criada com sucesso! Realizando login automático...", true);

        // Auto login
        const resLogin = await apiFetch("/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, senha })
        });
        if (resLogin.ok) {
          const dadosLogin = await resLogin.json();
          setToken(dadosLogin.access_token);
          setUsuarioLogado(dados);
          setTimeout(() => {
            window.location.href = "/";
          }, 1200);
        } else {
          tabLogin.click();
          mostrarAlerta("Conta criada com sucesso! Faça login com suas credenciais.", true);
        }

      } catch (err) {
        mostrarAlerta(err.message, false);
      } finally {
        btn.disabled = false;
        btn.textContent = "Cadastrar Conta";
      }
    });
  </script>
</body>
</html>
